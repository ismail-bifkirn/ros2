ekf_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true               # On est un robot au sol, pas un drone
    publish_tf: true               # L'EKF va publier le TF odom -> base_footprint

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom              # Le SLAM s'occupera du monde (map -> odom) plus tard

    # --- INPUT 1 : Les roues (/odom) ---
    # On lui dit : "Fais-moi confiance pour avancer en ligne droite (X, Y), mais ignore ton angle (Yaw)"
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # --- INPUT 2 : L'IMU (/imu) ---
    # On lui dit : "Fais-moi confiance pour l'angle (Yaw) et la vitesse de rotation, ignore la position"
    imu0: /imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    # differential: true est OBLIGATOIRE car l'IMU de Gazebo donne l'angle absolu du monde,
    # et on ne veut pas que le robot "saute" vers le nord magnétique au démarrage.
    imu0_differential: true 
    imu0_relative: false
